# DATASOURCE

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/full_Project
spring.datasource.username=root
spring.datasource.password=

# JPA, SQL
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
#spring.jpa.properties.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.MySQLLegacyDialect
spring.jpa.properties.hibernate.dialect.storage_engine=InnoDB
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# MAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username= <your email address>
spring.mail.password= <your email password>
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true




jwt.secret=mysupercomplexsecret

server.error.path=/user/error
server.error.whitelabel.enabled=false

